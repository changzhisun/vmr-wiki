[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vmr-wiki"
version = "0.1.0"
description = "Isolated video moment retrieval experiments over frozen visual timelines"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
official = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.2"]

[tool.setuptools.packages.find]
include = ["harness*", "adapters*", "agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

