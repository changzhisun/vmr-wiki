dataset:
  name: qvhighlights
  split: null  # Use --split with an exact name from dataset.json; no implicit alias.

# Relative paths are resolved against this config file, not the shell's cwd.
paths:
  datasets: datasets
  wiki: wiki
  runs: runs
  results: results
  templates: templates

ingest:
  sample_interval_sec: 5.0
  image_max_size: 768
  jpeg_quality: 2  # ffmpeg JPEG qscale, 2 (best) through 31
  vlm:
    provider: openai-compatible
    base_url: http://10.127.48.252:32002/job-f0147972fac1-20260703020458/v1
    api_key_env: OPENAI_API_KEY
    model: Qwen3-VL-8B-Instruct
    temperature: 0
    max_tokens: 512
    timeout_sec: 120
    max_retries: 3
    prompt: >-
      Describe the visible scene in this single video frame. State the people,
      objects, actions, spatial relations, and any visible state changes useful
      for locating events in time. Describe only what is visible; do not infer
      earlier or later actions. Return one concise factual paragraph.

query:
  agent: codex
  model: REPLACE_WITH_AGENT_MODEL
  max_predictions: 5
  timeout_sec: 600
  container_image: vmr-wiki-agents:local
  # Authentication is passed by environment variable name; values are never saved.
  api_key_env:
    codex: CODEX_API_KEY
    claude_code: ANTHROPIC_API_KEY
  # The agent has no direct internet route. A separate proxy sidecar permits
  # HTTPS CONNECT only to these exact model API hosts.
  egress_allowed_hosts:
    codex: [api.openai.com, chatgpt.com]
    claude_code: [api.anthropic.com]

evaluation:
  evaluator: qvhighlights
  top_k: [1, 5]
  iou_thresholds: [0.3, 0.5, 0.7]
