# Multi-frame windows. The prompt must contain exactly one {{FRAME_TIMESTAMPS}}
# placeholder. Stride must not exceed half the window.
# Model, base URL, and API key come from VLM_MODEL, VLM_BASE_URL, and VLM_API_KEY.
compile:
  compiler: dense
  repair_attempts: 2
  method_config:
    window_frames: 8
    stride_frames: 4
    timestamp_mode: absolute_seconds
profiles:
  vlms:
    qwen_default:
      provider: openai-compatible
      model: VLM_MODEL
      base_url: VLM_BASE_URL
      api_key_env: VLM_API_KEY
      prompt: >-
        Describe observable activities in these frames at {{FRAME_TIMESTAMPS}}.
        Use concise, specific titles and summaries. Do not infer invisible details.
      generation:
        temperature: 0
        max_tokens: 8192
      transport:
        timeout_sec: 120
        max_retries: 3
        max_concurrent_requests: 4
        max_retry_delay_sec: 60
        queue_timeout_sec: 300
