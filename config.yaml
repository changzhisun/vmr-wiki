dataset:
  name: qvhighlights
  split: null  # Use --split with an exact name from dataset.json; no implicit alias.

# Relative paths are resolved against this config file, not the shell's cwd.
paths:
  datasets: datasets
  wiki: wiki
  runs: runs
  results: results
  templates: templates

ingest:
  sample_interval_sec: 1.0
  # Dense mode returns validated temporal events; simple preserves plain captions.
  caption_mode: dense
  # One coordinate system per response. frame_index uses inclusive 0-based indices.
  dense_timestamp_mode: absolute_seconds
  # Number of sampled frames per VLM request, and sampled frames advanced per request.
  # The default 4/1 gives each sampled second a four-frame overlapping context window.
  caption_window_frames: 4
  caption_stride_frames: 1
  # Extra attempts allowed when a dense answer breaks the window contract; the
  # rejection is sent back to the captioner. 0 fails the video immediately.
  caption_max_repairs: 2
  image_max_size: 768
  jpeg_quality: 2  # ffmpeg JPEG qscale, 2 (best) through 31
  vlm:
    provider: openai-compatible
    # Replace this reserved example URL with your OpenAI-compatible VLM endpoint.
    base_url: https://vlm.example.com/v1
    api_key_env: OPENAI_API_KEY
    model: Qwen3-VL-8B-Instruct
    temperature: 0
    max_tokens: 2048
    timeout_sec: 120
    max_retries: 3
    prompt: |-
      You are generating dense temporal captions for Video Moment Retrieval.

      You are given sampled video frames in chronological order. The images
      correspond, in the same order, to exactly these timestamps in seconds:

      {{FRAME_TIMESTAMPS}}

      That list is the complete set of values you may use. This window ends at
      the last listed timestamp; later frames belong to other windows.

      Analyze only the visible evidence in these sampled frames and divide the
      window into meaningful visual events.

      For each event:

      - `start` and `end` must exactly match timestamps from the provided timeline;
      - write one concise, factual caption;
      - focus on actors, actions, object interactions, movement, spatial relations,
        and visible state changes;
      - prefer atomic events and split when the main visible action changes;
      - do not infer actions before, after, or between the sampled frames;
      - do not describe the same event more than once.

      Return exactly one JSON object with no Markdown or additional text. The
      object must contain only an `events` array. Each event object must contain
      exactly numeric `start`, numeric `end`, and string `caption` fields.

      Requirements:

      - events must be in chronological order;
      - `start <= end`;
      - every `start` and `end` must copy one of the listed values exactly; never
        round, interpolate, or extend past the last listed timestamp, even when
        an action clearly continues;
      - captions must be nonempty factual strings;
      - do not merge clearly different actions;
      - if no meaningful event is visible, return {"events":[]}.

query:
  agent: codex
  model: REPLACE_WITH_AGENT_MODEL
  max_predictions: 5
  timeout_sec: 600
  container_image: vmr-wiki-agents:local
  # Authentication is passed by environment variable name; values are never saved.
  api_key_env:
    codex: CODEX_API_KEY
    claude_code: ANTHROPIC_API_KEY
  # Optional OpenAI/Anthropic compatible gateway per agent; null uses the
  # vendor default. Must be https on port 443 and listed in
  # egress_allowed_hosts, because the proxy tunnels nothing else.
  base_url:
    codex: null
    claude_code: null
  # The agent has no direct internet route. A separate proxy sidecar permits
  # HTTPS CONNECT only to these exact model API hosts.
  # Replace these reserved example hosts with the endpoints used by each agent.
  egress_allowed_hosts:
    codex: [api.example.com, chat.example.com]
    claude_code: [api.example.net]

evaluation:
  evaluator: qvhighlights
  top_k: [1, 5]
  iou_thresholds: [0.3, 0.5, 0.7]
