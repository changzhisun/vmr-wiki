# Model, base URL, and API key come from VLM_MODEL, VLM_BASE_URL, and VLM_API_KEY.
compile:
  compiler: hierarchical
  repair_attempts: 2
  method_config:
    max_frames: 100
    max_depth: 4
    min_segment_sec: 2.0
    min_sample_interval_sec: 0.25
    overlap_ratio: 0.15
    uniform_fraction: 0.6
    analysis_fps: 2.0
    analysis_timeout_sec: 1800.0
    scene_threshold: 0.3
    max_children: 12
    max_nodes: 2000
    max_requests: 1000
    merge_adjacent: true
profiles:
  vlms:
    qwen_default:
      provider: openai-compatible
      model: VLM_MODEL
      base_url: VLM_BASE_URL
      api_key_env: VLM_API_KEY
      prompt: >-
        Describe observable activities at the requested semantic level. Use
        concise, specific titles and summaries. Keep stable actor/object
        descriptions across levels when supported by the images. Do not infer
        invisible details.
      generation:
        temperature: 0
        max_tokens: 8192
      transport:
        timeout_sec: 120
        max_retries: 3
        max_concurrent_requests: 4
        max_retry_delay_sec: 60
        queue_timeout_sec: 300
