# Default config for `vmr query`.
version: 3
dataset:
  name: monitor
  split: dev
storage:
  root: ../..
  datasets: datasets
  runs: runs
  results: results
  templates: templates
  artifacts: artifacts
profiles:
  agent:
    model: AGENT_MODEL
    container_image: vmr-wiki-agents:local
    api_key_env: AGENT_API_KEY
    base_url: AGENT_BASE_URL
    egress_allowed_hosts:
    - api.example.com
    - chat.example.com
    - api.example.net
    - note3-prev-api.askdiandian.com
    - api.anthropic.com
query:
  kind: claude_code
  type: video-wiki  # video-wiki | video-only；video-only 不需要 --wiki-set
  input_mode: multimodal
  max_predictions: 5
  timeout_sec: 600
  templates:
    agents: query_agents.video_wiki.md
    prompt: query_prompt.video_wiki.md
    text:
      agents: query_agents.video_wiki.text_only.md
      prompt: query_prompt.video_wiki.text_only.md
