dataset:
  name: qvhighlights
  split: null  # Use --split with an exact name from dataset.json; no implicit alias.

# Relative paths are resolved against this config file, not the shell's cwd.
paths:
  datasets: datasets
  wiki: wiki-hierarchical  # New root; existing flat/frozen Wikis remain reusable with their old config.
  runs: runs
  results: results
  templates: templates

ingest:
  sample_interval_sec: 1.0
  # Hierarchical is the new default; dense/simple remain available for legacy experiments.
  caption_mode: hierarchical
  # Legacy Dense coordinate system; hierarchical always uses absolute seconds.
  dense_timestamp_mode: absolute_seconds
  # Legacy Simple/Dense window parameters; hierarchical uses hierarchy.max_frames.
  caption_window_frames: 5
  caption_stride_frames: 1
  # Extra attempts allowed when a structured answer breaks its schema; the
  # rejection is sent back to the captioner. 0 fails the video immediately.
  caption_max_repairs: 2
  image_max_size: 768
  jpeg_quality: 2  # ffmpeg JPEG qscale, 2 (best) through 31
  vlm:
    provider: openai-compatible
    # Replace this reserved example URL with your OpenAI-compatible VLM endpoint.
    base_url: https://vlm.example.com/v1
    api_key_env: OPENAI_API_KEY
    model: Qwen3-VL-8B-Instruct
    temperature: 0
    max_tokens: 8192
    timeout_sec: 120
    max_retries: 3
    prompt: |-
      Describe observable activities at the requested semantic level. Use concise,
      specific titles and summaries. Keep stable actor/object descriptions across
      levels when supported by the images. Do not infer invisible details.
  hierarchy:
    max_frames: 100  # Hard upper bound per VLM request, including merge requests.
    max_depth: 4     # Chapter -> Scene -> Event -> Action.
    min_segment_sec: 2.0
    min_sample_interval_sec: 0.25
    overlap_ratio: 0.15  # Context overlap at each shared target boundary.
    uniform_fraction: 0.6  # Remaining quota: scene-change neighborhoods and motion.
    analysis_fps: 2.0
    analysis_timeout_sec: 1800
    scene_threshold: 0.3
    max_children: 12
    max_nodes: 2000
    max_requests: 1000  # Logical split/merge requests, excluding repairs/retries.
    merge_adjacent: true

query:
  agent: codex
  model: REPLACE_WITH_AGENT_MODEL
  max_predictions: 5
  timeout_sec: 600
  container_image: vmr-wiki-agents:local
  # Authentication is passed by environment variable name; values are never saved.
  api_key_env:
    codex: CODEX_API_KEY
    claude_code: ANTHROPIC_API_KEY
  # Optional OpenAI/Anthropic compatible gateway per agent; null uses the
  # vendor default. Must be https on port 443 and listed in
  # egress_allowed_hosts, because the proxy tunnels nothing else.
  base_url:
    codex: null
    claude_code: null
  # The agent has no direct internet route. A separate proxy sidecar permits
  # HTTPS CONNECT only to these exact model API hosts.
  # Replace these reserved example hosts with the endpoints used by each agent.
  egress_allowed_hosts:
    codex: [api.example.com, chat.example.com]
    claude_code: [api.example.net]

evaluation:
  evaluator: qvhighlights
  top_k: [1, 5]
  iou_thresholds: [0.3, 0.5, 0.7]
